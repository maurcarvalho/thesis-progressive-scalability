<svg viewBox="0 0 1100 920" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- Title -->
  <rect x="40" y="20" width="680" height="52" rx="26" fill="#2c3845"/>
  <text x="380" y="55" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Worked application: payments vs. inventory</text>

  <!-- Column headers -->
  <rect x="380" y="98" width="320" height="62" rx="10" fill="#e8f1fb" stroke="#2f6db0" stroke-width="2"/>
  <text x="540" y="126" font-size="20" font-weight="700" fill="#1f2933" text-anchor="middle">Payments module</text>
  <text x="540" y="148" font-size="15" font-style="italic" fill="#5b6770" text-anchor="middle">extraction justified</text>

  <rect x="720" y="98" width="320" height="62" rx="10" fill="#faf1dd" stroke="#c08a2d" stroke-width="2"/>
  <text x="880" y="126" font-size="20" font-weight="700" fill="#1f2933" text-anchor="middle">Inventory module</text>
  <text x="880" y="148" font-size="15" font-style="italic" fill="#5b6770" text-anchor="middle">extraction not justified</text>

  <!-- Q1 -->
  <rect x="40" y="178" width="320" height="80" rx="8" fill="#f5f5f5" stroke="#54677a" stroke-width="1"/>
  <text x="60" y="208" font-size="16" font-weight="700" fill="#1f2933">Q1. Integration Strength</text>
  <text x="60" y="230" font-size="14" fill="#5b6770">low and stable?</text>
  <text x="60" y="250" font-size="13" font-style="italic" fill="#5b6770">Khononov; G2 ISI &#8805; 0.8</text>

  <rect x="380" y="178" width="320" height="80" rx="8" fill="#ffffff" stroke="#3f8f5f" stroke-width="1.5"/>
  <text x="400" y="206" font-size="26" font-weight="700" fill="#3f8f5f">&#10003;</text>
  <text x="438" y="206" font-size="16" font-weight="700" fill="#1f2933">ISI = 0.92</text>
  <text x="400" y="232" font-size="14" fill="#5b6770">Kafka topics carry all cross-module</text>
  <text x="400" y="251" font-size="14" fill="#5b6770">integration; contract-level.</text>

  <rect x="720" y="178" width="320" height="80" rx="8" fill="#ffffff" stroke="#3f8f5f" stroke-width="1.5"/>
  <text x="740" y="206" font-size="26" font-weight="700" fill="#3f8f5f">&#10003;</text>
  <text x="778" y="206" font-size="16" font-weight="700" fill="#1f2933">Also passes</text>
  <text x="740" y="232" font-size="14" fill="#5b6770">Structural readiness is in place</text>
  <text x="740" y="251" font-size="14" fill="#5b6770">for inventory as well.</text>

  <!-- Q2 -->
  <rect x="40" y="268" width="320" height="80" rx="8" fill="#f5f5f5" stroke="#54677a" stroke-width="1"/>
  <text x="60" y="298" font-size="16" font-weight="700" fill="#1f2933">Q2. Strength-Distance-Volatility</text>
  <text x="60" y="320" font-size="14" fill="#5b6770">balance OK?</text>
  <text x="60" y="340" font-size="13" font-style="italic" fill="#5b6770">Khononov BALANCE</text>

  <rect x="380" y="268" width="320" height="80" rx="8" fill="#ffffff" stroke="#3f8f5f" stroke-width="1.5"/>
  <text x="400" y="296" font-size="26" font-weight="700" fill="#3f8f5f">&#10003;</text>
  <text x="438" y="296" font-size="16" font-weight="700" fill="#1f2933">Balanced</text>
  <text x="400" y="322" font-size="14" fill="#5b6770">High Distance (PCI scope),</text>
  <text x="400" y="341" font-size="14" fill="#5b6770">low Volatility (6-month stable schema).</text>

  <rect x="720" y="268" width="320" height="80" rx="8" fill="#ffffff" stroke="#3f8f5f" stroke-width="1.5"/>
  <text x="740" y="296" font-size="26" font-weight="700" fill="#3f8f5f">&#10003;</text>
  <text x="778" y="296" font-size="16" font-weight="700" fill="#1f2933">Balanced</text>
  <text x="740" y="322" font-size="14" fill="#5b6770">Low Volatility, contract stability</text>
  <text x="740" y="341" font-size="14" fill="#5b6770">already in place.</text>

  <!-- Q3 -->
  <rect x="40" y="358" width="320" height="80" rx="8" fill="#f5f5f5" stroke="#54677a" stroke-width="1"/>
  <text x="60" y="388" font-size="16" font-weight="700" fill="#1f2933">Q3. Outcome the monolith</text>
  <text x="60" y="410" font-size="14" fill="#5b6770">cannot deliver?</text>
  <text x="60" y="430" font-size="13" font-style="italic" fill="#5b6770">Newman Three Key Questions</text>

  <rect x="380" y="358" width="320" height="80" rx="8" fill="#ffffff" stroke="#3f8f5f" stroke-width="1.5"/>
  <text x="400" y="386" font-size="26" font-weight="700" fill="#3f8f5f">&#10003;</text>
  <text x="438" y="386" font-size="16" font-weight="700" fill="#1f2933">PCI compliance scope</text>
  <text x="400" y="412" font-size="14" fill="#5b6770">Extracting payments isolates the</text>
  <text x="400" y="431" font-size="14" fill="#5b6770">PCI audit scope from the monolith.</text>

  <rect x="720" y="358" width="320" height="80" rx="8" fill="#ffffff" stroke="#b04a4a" stroke-width="1.5"/>
  <text x="740" y="386" font-size="26" font-weight="700" fill="#b04a4a">&#10007;</text>
  <text x="778" y="386" font-size="16" font-weight="700" fill="#1f2933">No outcome</text>
  <text x="740" y="412" font-size="14" fill="#5b6770">G3 L1 Decouple already delivers the</text>
  <text x="740" y="431" font-size="14" fill="#5b6770">required scaling within the monolith.</text>

  <!-- Q4 -->
  <rect x="40" y="448" width="320" height="80" rx="8" fill="#f5f5f5" stroke="#54677a" stroke-width="1"/>
  <text x="60" y="478" font-size="16" font-weight="700" fill="#1f2933">Q4. Alternatives ruled out?</text>
  <text x="60" y="520" font-size="13" font-style="italic" fill="#5b6770">Newman Three Key Questions</text>

  <rect x="380" y="448" width="320" height="80" rx="8" fill="#ffffff" stroke="#3f8f5f" stroke-width="1.5"/>
  <text x="400" y="476" font-size="26" font-weight="700" fill="#3f8f5f">&#10003;</text>
  <text x="438" y="476" font-size="16" font-weight="700" fill="#1f2933">L2 Isolate insufficient</text>
  <text x="400" y="502" font-size="14" fill="#5b6770">PCI requires separate deployment,</text>
  <text x="400" y="521" font-size="14" fill="#5b6770">not just separate schema.</text>

  <rect x="720" y="448" width="320" height="80" rx="8" fill="#fafafa" stroke="#8a96a3" stroke-width="1.5"/>
  <text x="740" y="476" font-size="26" font-weight="700" fill="#8a96a3">&#8212;</text>
  <text x="778" y="476" font-size="16" fill="#8a96a3">Not evaluated</text>
  <text x="740" y="502" font-size="14" fill="#8a96a3">Q3 not satisfied; no outcome to</text>
  <text x="740" y="521" font-size="14" fill="#8a96a3">justify ruling out alternatives.</text>

  <!-- Q5 -->
  <rect x="40" y="538" width="320" height="80" rx="8" fill="#f5f5f5" stroke="#54677a" stroke-width="1"/>
  <text x="60" y="568" font-size="16" font-weight="700" fill="#1f2933">Q5. Team capability for</text>
  <text x="60" y="590" font-size="14" fill="#5b6770">distributed operation?</text>
  <text x="60" y="610" font-size="13" font-style="italic" fill="#5b6770">Newman Three Key Questions</text>

  <rect x="380" y="538" width="320" height="80" rx="8" fill="#ffffff" stroke="#3f8f5f" stroke-width="1.5"/>
  <text x="400" y="566" font-size="26" font-weight="700" fill="#3f8f5f">&#10003;</text>
  <text x="438" y="566" font-size="16" font-weight="700" fill="#1f2933">Capability in place</text>
  <text x="400" y="592" font-size="14" fill="#5b6770">OTel tracing, Temporal experience,</text>
  <text x="400" y="611" font-size="14" fill="#5b6770">on-call monitors Kafka topics.</text>

  <rect x="720" y="538" width="320" height="80" rx="8" fill="#fafafa" stroke="#8a96a3" stroke-width="1.5"/>
  <text x="740" y="566" font-size="26" font-weight="700" fill="#8a96a3">&#8212;</text>
  <text x="778" y="566" font-size="16" fill="#8a96a3">Not evaluated</text>
  <text x="740" y="592" font-size="14" fill="#8a96a3">Q3 not satisfied; capability is not</text>
  <text x="740" y="611" font-size="14" fill="#8a96a3">a deciding factor here.</text>

  <!-- Q6 -->
  <rect x="40" y="628" width="320" height="80" rx="8" fill="#f5f5f5" stroke="#54677a" stroke-width="1"/>
  <text x="60" y="658" font-size="16" font-weight="700" fill="#1f2933">Q6. Saga style fits</text>
  <text x="60" y="680" font-size="14" fill="#5b6770">team topology?</text>
  <text x="60" y="700" font-size="13" font-style="italic" fill="#5b6770">Newman saga-style guidance</text>

  <rect x="380" y="628" width="320" height="80" rx="8" fill="#ffffff" stroke="#3f8f5f" stroke-width="1.5"/>
  <text x="400" y="656" font-size="26" font-weight="700" fill="#3f8f5f">&#10003;</text>
  <text x="438" y="656" font-size="16" font-weight="700" fill="#1f2933">Choreographed</text>
  <text x="400" y="682" font-size="14" fill="#5b6770">Different teams own orders and</text>
  <text x="400" y="701" font-size="14" fill="#5b6770">shipments; events decouple them.</text>

  <rect x="720" y="628" width="320" height="80" rx="8" fill="#fafafa" stroke="#8a96a3" stroke-width="1.5"/>
  <text x="740" y="656" font-size="26" font-weight="700" fill="#8a96a3">&#8212;</text>
  <text x="778" y="656" font-size="16" fill="#8a96a3">Not evaluated</text>
  <text x="740" y="682" font-size="14" fill="#8a96a3">Q3 not satisfied; the module</text>
  <text x="740" y="701" font-size="14" fill="#8a96a3">stays inside the monolith.</text>

  <!-- Verdict -->
  <rect x="40" y="730" width="320" height="62" rx="10" fill="#2c3845"/>
  <text x="200" y="769" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Verdict</text>

  <rect x="380" y="730" width="320" height="62" rx="10" fill="#3f8f5f"/>
  <text x="540" y="769" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">EXTRACT</text>

  <rect x="720" y="730" width="320" height="62" rx="10" fill="#b04a4a"/>
  <text x="880" y="769" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">KEEP IN MONOLITH</text>

  <!-- Footnote -->
  <text x="40" y="838" font-size="14" font-style="italic" fill="#8a96a3">Inventory passes the structural questions (Q1 and Q2) but fails Q3: the G3 L1 Decouple tier already delivers the required scaling.</text>
  <text x="40" y="862" font-size="14" font-style="italic" fill="#8a96a3">When Q3 fails the remaining questions are not evaluated, since extraction is no longer the cheapest option that satisfies the outcome.</text>
</svg>
